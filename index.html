<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>กระดานสำรวจการส่งทีมแข่งขันกีฬา ตำบลแม่พูล</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans Thai', sans-serif; 
            background-color: #0f172a; 
            background-image: url('https://res.cloudinary.com/dygneumft/image/upload/v1789369742/%E0%B8%A3%E0%B8%B0%E0%B8%9A%E0%B8%9A%E0%B8%88%E0%B8%B1%E0%B8%94%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%81%E0%B8%B5%E0%B8%AC%E0%B8%B2/ChatGPT_Image_14_%E0%B8%81.%E0%B8%A2._2569_12_29_45_r7fwat.png'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; } .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .toggle-checkbox:checked { right: 0; border-color: #22c55e; }
        .toggle-checkbox:checked + .toggle-label { background-color: #22c55e; }
        .toggle-checkbox { right: 0; z-index: 1; border-color: #e2e8f0; transition: all 0.3s; }
        .toggle-label { background-color: #cbd5e1; transition: all 0.3s; }
        @keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-pop { animation: pop 0.3s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen text-slate-800">
    <div id="root"></div>
    <script type="text/babel">
        // ตั้งค่า Firebase (ตู้เดิม)
        const firebaseConfig = { apiKey: "AIzaSyDNRDUtq1iwaGglCrDoCpj2omzl0MwQj1I", authDomain: "maepoon-sports.firebaseapp.com", databaseURL: "https://maepoon-sports-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "maepoon-sports", storageBucket: "maepoon-sports.firebasestorage.app", messagingSenderId: "704068246747", appId: "1:704068246747:web:f2e6c0a9b5a6921ad580fe" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();
        const { useState, useEffect } = React;

        const Icons = {
            Users: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Lock: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
            CheckCircle: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>,
            AlertCircle: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>,
            ChevronLeft: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>,
            Settings: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        };

        // รายชื่อ 10 ทีมที่คุยกันไว้
        const VILLAGES = [
            { id: 'v1', name: 'หมู่ 1' }, { id: 'v2', name: 'หมู่ 2' }, { id: 'v3', name: 'หมู่ 3' },
            { id: 'v4', name: 'หมู่ 4' }, { id: 'v5', name: 'หมู่ 5' }, { id: 'v6', name: 'หมู่ 6' },
            { id: 'v7_11', name: 'หมู่ 7+11' }, { id: 'v8', name: 'หมู่ 8' }, { id: 'v9', name: 'หมู่ 9' },
            { id: 'v10', name: 'หมู่ 10' }
        ];

        function App() {
            const [currentYear, setCurrentYear] = useState(() => localStorage.getItem('currentYear') || '2569');
            const [view, setView] = useState('dashboard'); // dashboard, pin, select_team, form, admin
            const [pinInput, setPinInput] = useState('');
            const [selectedTeamId, setSelectedTeamId] = useState(null);
            
            const [sportsData, setSportsData] = useState([]); // รายชื่อกีฬาจากระบบหลัก
            const [surveyData, setSurveyData] = useState({}); // ผลการติ๊กจากชาวบ้าน
            const [isSurveyOpen, setIsSurveyOpen] = useState(true);
            const [isLoaded, setIsLoaded] = useState(false);

            // ดึงข้อมูล 2 แหล่งพร้อมกัน
            useEffect(() => {
                setIsLoaded(false);
                // 1. ดึงรายชื่อกีฬาจากระบบหลัก (sportData)
                const sportRef = db.ref(`sportData_${currentYear}`);
                const sportListener = sportRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    let sportsList = [];
                    if (data) {
                        const actIntl = data.activities ? Object.values(data.activities).find(a => a.id === 'intl')?.selected : false;
                        const actTrad = data.activities ? Object.values(data.activities).find(a => a.id === 'trad')?.selected : false;
                        
                        if (actIntl && data.intlSports) {
                            Object.values(data.intlSports).filter(s => s.selected !== false).forEach((s, i) => sportsList.push({...s, type: 'intl', key: `intl_${s.id || 'ci'+i}`}));
                            if (data.customIntlSports) Object.values(data.customIntlSports).forEach((s, i) => sportsList.push({...s, type: 'intl', key: `intl_c${i}`}));
                        }
                        if (actTrad && data.tradSports) {
                            Object.values(data.tradSports).filter(s => s.selected).forEach((s, i) => sportsList.push({...s, type: 'trad', key: `trad_${s.id || 'c'+i}`}));
                            if (data.customTradSports) Object.values(data.customTradSports).forEach((s, i) => sportsList.push({...s, type: 'trad', key: `trad_c${i}`}));
                        }
                    }
                    setSportsData(sportsList);
                });

                // 2. ดึงข้อมูลการโหวตและการตั้งค่า (surveyData)
                const surveyRef = db.ref(`surveyData_${currentYear}`);
                const surveyListener = surveyRef.on('value', (snapshot) => {
                    const data = snapshot.val() || {};
                    setSurveyData(data.votes || {});
                    setIsSurveyOpen(data.settings?.isOpen !== false); // Default true
                    setIsLoaded(true);
                });

                return () => { sportRef.off('value', sportListener); surveyRef.off('value', surveyListener); };
            }, [currentYear]);

            const getSportDisplayName = (sport) => {
                if (sport.type === 'trad') return sport.name;
                return `${sport.name} ${sport.ageText || ''} ${sport.age !== null && sport.age !== undefined ? sport.age : ''} ${sport.unit || ''}`.trim();
            };

            const handlePinSubmit = () => {
                if (pinInput === '1234') {
                    if (!isSurveyOpen) { alert('ระบบปิดรับการสำรวจแล้วครับ'); setPinInput(''); return; }
                    setView('select_team'); 
                } else if (pinInput === '055457600') {
                    setView('admin');
                } else {
                    alert('รหัส PIN ไม่ถูกต้องครับ'); 
                }
                setPinInput('');
            };

            const toggleVote = (sportKey) => {
                if (!isSurveyOpen) return;
                const currentStatus = surveyData[sportKey]?.[selectedTeamId] || false;
                db.ref(`surveyData_${currentYear}/votes/${sportKey}/${selectedTeamId}`).set(!currentStatus);
            };

            const toggleSurveyStatus = () => {
                db.ref(`surveyData_${currentYear}/settings/isOpen`).set(!isSurveyOpen);
            };

            // ================== หน้า 1: Dashboard (ผู้ชมทั่วไป) ==================
            if (view === 'dashboard') {
                return (
                    <div className="max-w-6xl mx-auto p-4 md:p-6 pb-24 mt-6 animate-pop">
                        <div className="bg-white/95 backdrop-blur-xl rounded-[2rem] shadow-2xl overflow-hidden border border-white/50">
                            
                            {/* ส่วนหัว Header (ไล่สีสปอร์ตเข้ม) */}
                            <div className="bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-900 p-8 md:p-10 text-center relative overflow-hidden border-b border-white/20">
                                <div className="absolute top-0 left-0 w-full h-full opacity-5 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+CjxwYXRoIGQ9Ik0yMCAwbDIwIDIwdjIwbC0yMC0yMEwwIDQwdjIwTDIwIDIweiIgZmlsbD0iI2ZmZiIvPgo8L3N2Zz4=')]"></div>
                                <img src="https://res.cloudinary.com/dygneumft/image/upload/v1790671097/%E0%B8%95%E0%B8%B1%E0%B8%94%E0%B8%9E%E0%B8%B7%E0%B9%89%E0%B8%99%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%87_k3ngma.png" className="w-24 h-24 md:w-32 md:h-32 mx-auto mb-4 relative z-10 drop-shadow-[0_10px_20px_rgba(0,0,0,0.5)] hover:scale-105 transition-transform duration-300" alt="โลโก้" />
                                <h1 className="text-2xl md:text-4xl font-black text-white relative z-10 mb-2 drop-shadow-md">กระดานสำรวจความต้องการส่งทีม</h1>
                                <p className="text-blue-200 font-bold relative z-10 text-lg">กีฬาตำบลแม่พูล ประจำปี {currentYear}</p>
                            </div>
                            
                            <div className="p-4 md:p-6 bg-slate-50/80 flex flex-col md:flex-row justify-between items-center gap-4 border-b border-slate-200">
                                <div className="flex items-center space-x-2">
                                    {isSurveyOpen ? 
                                        <span className="bg-green-100 text-green-700 px-4 py-2 rounded-full font-bold text-sm md:text-base flex items-center shadow-sm border border-green-200"><Icons.CheckCircle className="w-5 h-5 mr-1.5"/> เปิดรับการสำรวจ</span> : 
                                        <span className="bg-red-100 text-red-700 px-4 py-2 rounded-full font-bold text-sm md:text-base flex items-center shadow-sm border border-red-200"><Icons.Lock className="w-5 h-5 mr-1.5"/> ปิดรับการสำรวจแล้ว</span>
                                    }
                                </div>
                                <button onClick={() => setView('pin')} className="w-full md:w-auto bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-bold py-3 md:py-4 px-8 rounded-full shadow-lg transition-transform transform hover:-translate-y-1 flex items-center justify-center text-lg border-2 border-white/30">
                                    <Icons.Users className="w-5 h-5 mr-2" /> เข้าสู่หน้ากรอกแบบสำรวจ
                                </button>
                            </div>

                            <div className="overflow-x-auto w-full">
                                <table className="w-full text-center border-collapse text-[11px] md:text-sm">
                                    <thead className="bg-slate-900 text-white font-extrabold sticky top-0 z-40">
                                        <tr>
                                            <th className="p-2 md:p-3 border-r border-slate-700 w-12 md:w-16 align-middle" rowSpan={2}>ลำดับ</th>
                                            <th className="p-2 md:p-3 border-r border-slate-700 text-left min-w-[150px] md:min-w-[250px] align-middle" rowSpan={2}>ประเภทกีฬา</th>
                                            <th className="p-1 md:p-2 border-b border-slate-700 bg-slate-800" colSpan={VILLAGES.length}>การตัดสินใจของแต่ละหมู่บ้าน</th>
                                            <th className="p-2 md:p-3 w-16 md:w-24 bg-indigo-900 align-middle" rowSpan={2}>ยอดรวม</th>
                                        </tr>
                                        <tr className="bg-slate-800 text-[9px] md:text-xs font-bold text-slate-200 shadow-inner">
                                            {VILLAGES.map((v) => (<th key={v.id} className="p-1 md:p-2 border-r border-slate-700 min-w-[40px] md:min-w-[60px] align-middle">{v.name.replace('หมู่ ', 'ม.')}</th>))}
                                        </tr>
                                    </thead>
                                    <tbody className="bg-white/90">
                                        {sportsData.map((sport, index) => {
                                            const totalTeams = VILLAGES.reduce((sum, v) => sum + (surveyData[sport.key]?.[v.id] ? 1 : 0), 0);
                                            const isReady = totalTeams >= 4;
                                            return (
                                                <tr key={sport.key} className="border-b border-slate-200 hover:bg-slate-50 transition-colors">
                                                    <td className="p-2 border-r border-slate-200 font-bold text-slate-500 align-middle">{index + 1}</td>
                                                    <td className="p-2 border-r border-slate-200 font-bold text-slate-800 text-left pl-2 md:pl-4 align-middle">{getSportDisplayName(sport)}</td>
                                                    {VILLAGES.map(v => {
                                                        const isChecked = surveyData[sport.key]?.[v.id];
                                                        return (
                                                            <td key={`${sport.key}_${v.id}`} className="p-1 border-r border-slate-200 align-middle">
                                                                {isChecked ? <Icons.CheckCircle className="w-5 h-5 md:w-6 md:h-6 mx-auto text-green-500 drop-shadow-sm"/> : <span className="text-slate-300">-</span>}
                                                            </td>
                                                        );
                                                    })}
                                                    <td className={`p-1 md:p-2 align-middle border-l-2 border-slate-300 shadow-inner`}>
                                                        <div className={`font-black text-sm md:text-lg ${totalTeams === 0 ? 'text-slate-400' : (isReady ? 'text-green-700' : 'text-orange-600')}`}>{totalTeams}</div>
                                                        {!isReady && totalTeams > 0 && <div className="text-[9px] md:text-[10px] text-orange-600 font-bold mt-0.5 leading-tight">(ขาดอีก {4 - totalTeams})</div>}
                                                        {isReady && <div className="text-[9px] md:text-[10px] text-green-600 font-bold mt-0.5 leading-tight">(จัดแข่งได้)</div>}
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                        {sportsData.length === 0 && (<tr><td colSpan={VILLAGES.length + 3} className="py-10 text-slate-400 font-bold bg-white">รอผู้ดูแลระบบตั้งค่ารายการกีฬา</td></tr>)}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            }

            // ================== หน้า 2: PIN Prompt ==================
            if (view === 'pin') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 animate-pop">
                        <div className="bg-white/95 backdrop-blur-xl p-8 rounded-[2rem] shadow-2xl w-full max-w-sm text-center border border-white/50 relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-orange-500 to-red-500"></div>
                            <div className="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-5 shadow-inner mt-2"><Icons.Lock className="w-10 h-10" /></div>
                            <h3 className="text-2xl font-black text-slate-800 mb-2">กรุณาใส่รหัสผ่าน</h3>
                            <p className="text-sm text-slate-500 mb-6 font-medium">รหัสผ่าน 4 หลัก สำหรับตัวแทนหมู่บ้าน</p>
                            <input type="tel" className="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-4 text-center text-3xl tracking-[0.4em] font-black text-slate-800 outline-none focus:border-indigo-500 mb-6 shadow-inner" value={pinInput} onChange={e => setPinInput(e.target.value.replace(/\D/g, ''))} placeholder="••••" onKeyDown={(e) => { if(e.key === 'Enter') handlePinSubmit(); }} autoFocus />
                            <div className="flex gap-3">
                                <button onClick={() => setView('dashboard')} className="flex-1 px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-colors">ยกเลิก</button>
                                <button onClick={handlePinSubmit} className="flex-1 px-4 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-colors">ยืนยัน</button>
                            </div>
                        </div>
                    </div>
                );
            }

            // ================== หน้า 3: เลือกหมู่บ้าน ==================
            if (view === 'select_team') {
                return (
                    <div className="max-w-4xl mx-auto p-4 md:p-6 animate-pop min-h-screen flex flex-col justify-center">
                        <div className="bg-white/95 backdrop-blur-xl p-6 md:p-10 rounded-[2.5rem] shadow-2xl border border-white/50 relative">
                            <div className="text-center mb-8">
                                <h2 className="text-2xl md:text-4xl font-black text-indigo-950 mb-2 drop-shadow-sm">ท่านคือตัวแทนจากหมู่บ้านใด?</h2>
                                <p className="text-slate-500 font-bold">กรุณาเลือกหมู่บ้านของท่านเพื่อเข้าสู่หน้ากรอกแบบฟอร์ม</p>
                            </div>
                            <div className="grid grid-cols-2 md:grid-cols-5 gap-3 md:gap-4">
                                {VILLAGES.map(v => (
                                    <button key={v.id} onClick={() => { setSelectedTeamId(v.id); setView('form'); }} className="bg-white/80 hover:bg-indigo-50 border-2 border-slate-200 hover:border-indigo-400 p-4 rounded-2xl shadow-sm hover:shadow-md transition-all flex flex-col items-center justify-center gap-2 group">
                                        <div className="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center font-black text-xl group-hover:scale-110 transition-transform shadow-inner">{v.name.replace('หมู่ ','')}</div>
                                        <span className="font-bold text-slate-700 group-hover:text-indigo-800">{v.name}</span>
                                    </button>
                                ))}
                            </div>
                            <div className="mt-8 text-center pt-6 border-t border-slate-200">
                                <button onClick={() => setView('dashboard')} className="text-slate-500 font-bold hover:text-slate-800 flex items-center justify-center mx-auto transition-colors"><Icons.ChevronLeft className="w-5 h-5 mr-1"/> กลับไปหน้ากระดานสรุป</button>
                            </div>
                        </div>
                    </div>
                );
            }

            // ================== หน้า 4: ฟอร์มกรอกข้อมูล (สำหรับตัวแทนหมู่บ้าน) ==================
            if (view === 'form') {
                const teamName = VILLAGES.find(v => v.id === selectedTeamId)?.name;
                return (
                    <div className="max-w-2xl mx-auto p-4 pb-24 mt-4 animate-pop">
                        <div className="flex items-center justify-between mb-6 bg-white/95 backdrop-blur-md p-4 rounded-2xl shadow-md border border-white/50 sticky top-4 z-40">
                            <button onClick={() => setView('select_team')} className="p-2 text-slate-500 hover:bg-slate-100 rounded-full transition-colors"><Icons.ChevronLeft className="w-6 h-6"/></button>
                            <h2 className="text-xl md:text-2xl font-black text-indigo-900 text-center flex-1">แบบสำรวจ: <span className="text-orange-600">{teamName}</span></h2>
                        </div>
                        
                        {!isSurveyOpen && (
                            <div className="bg-red-50/95 backdrop-blur-sm border border-red-200 text-red-700 p-4 rounded-2xl mb-6 text-center font-bold flex items-center justify-center shadow-sm">
                                <Icons.Lock className="w-5 h-5 mr-2"/> ระบบปิดรับการสำรวจแล้ว ไม่สามารถแก้ไขข้อมูลได้
                            </div>
                        )}

                        <div className="bg-white/95 backdrop-blur-xl rounded-3xl shadow-xl border border-white/50 overflow-hidden">
                            <div className="bg-slate-900 p-4 text-white text-sm md:text-base font-bold flex justify-between items-center shadow-sm">
                                <span>รายการกีฬาเปิดรับสมัคร</span>
                                <span className="bg-slate-700 px-3 py-1 rounded-full text-[10px] md:text-xs font-bold border border-slate-600">แตะสวิตช์เพื่อส่งทีม</span>
                            </div>
                            <div className="divide-y divide-slate-200/60">
                                {sportsData.map(sport => {
                                    const isChecked = surveyData[sport.key]?.[selectedTeamId] || false;
                                    return (
                                        <label key={sport.key} className={`flex items-center justify-between p-4 md:p-5 transition-colors cursor-pointer ${isChecked ? 'bg-green-50/60' : 'hover:bg-slate-50'}`}>
                                            <div className="flex-1 pr-4">
                                                <div className={`font-bold text-base md:text-lg transition-colors ${isChecked ? 'text-green-800' : 'text-slate-800'}`}>{getSportDisplayName(sport)}</div>
                                                <div className="text-xs font-medium text-slate-400 mt-0.5">{sport.type === 'trad' ? 'กีฬาพื้นบ้าน' : 'กีฬาสากล'}</div>
                                            </div>
                                            <div className="relative inline-block w-14 align-middle select-none transition duration-200 ease-in shrink-0">
                                                <input type="checkbox" checked={isChecked} onChange={() => toggleVote(sport.key)} disabled={!isSurveyOpen} className="toggle-checkbox absolute block w-7 h-7 rounded-full bg-white border-4 appearance-none cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed shadow-sm"/>
                                                <label className={`toggle-label block overflow-hidden h-7 rounded-full cursor-pointer border border-slate-200 shadow-inner ${!isSurveyOpen ? 'opacity-50 cursor-not-allowed' : ''}`}></label>
                                            </div>
                                        </label>
                                    );
                                })}
                                {sportsData.length === 0 && <div className="p-8 text-center text-slate-400 font-bold bg-white">รอผู้ดูแลระบบตั้งค่ารายการกีฬา</div>}
                            </div>
                        </div>

                        <div className="mt-8 text-center">
                            <button onClick={() => setView('dashboard')} className="bg-slate-900 text-white font-bold py-4 px-8 rounded-2xl shadow-xl w-full md:w-auto hover:bg-slate-800 transition-transform transform hover:-translate-y-1 border border-slate-700">
                                บันทึกและกลับไปหน้ากระดานสรุป
                            </button>
                        </div>
                    </div>
                );
            }

            // ================== หน้า 5: โหมด Admin (เปิด-ปิดระบบ) ==================
            if (view === 'admin') {
                return (
                    <div className="max-w-xl mx-auto p-4 animate-pop min-h-screen flex flex-col justify-center">
                        <div className="bg-white/95 backdrop-blur-xl rounded-[2.5rem] shadow-2xl border border-white/50 overflow-hidden text-center p-8 relative">
                            <div className="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-rose-500 to-pink-500"></div>
                            <div className="w-24 h-24 bg-rose-50 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner mt-4 border border-rose-100"><Icons.Settings className="w-12 h-12" /></div>
                            <h2 className="text-3xl font-black text-slate-800 mb-2">โหมดผู้ดูแลระบบ</h2>
                            <p className="text-slate-500 mb-8 font-bold">ควบคุมสถานะการรับผลสำรวจ</p>

                            <div className="bg-slate-50/80 p-6 rounded-2xl border border-slate-200 flex flex-col items-center justify-center mb-8 shadow-inner">
                                <span className="font-bold text-slate-600 text-lg mb-4">สถานะปัจจุบัน</span>
                                {isSurveyOpen ? (
                                    <div className="text-green-700 font-black text-2xl flex items-center bg-green-100 px-6 py-4 rounded-xl border-2 border-green-300 shadow-sm"><Icons.CheckCircle className="w-8 h-8 mr-2"/> เปิดให้ชาวบ้านกรอก</div>
                                ) : (
                                    <div className="text-red-700 font-black text-2xl flex items-center bg-red-100 px-6 py-4 rounded-xl border-2 border-red-300 shadow-sm"><Icons.Lock className="w-8 h-8 mr-2"/> ปิดระบบแล้ว</div>
                                )}
                            </div>

                            <button onClick={toggleSurveyStatus} className={`w-full py-5 rounded-2xl font-black text-xl text-white shadow-xl transition-all transform hover:-translate-y-1 border-2 border-white/20 ${isSurveyOpen ? 'bg-gradient-to-r from-red-500 to-rose-600 hover:from-red-600 hover:to-rose-700' : 'bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700'}`}>
                                {isSurveyOpen ? 'กดเพื่อ "ปิดรับ" การสำรวจ' : 'กดเพื่อ "เปิดรับ" การสำรวจอีกครั้ง'}
                            </button>
                            
                            <button onClick={() => setView('dashboard')} className="mt-6 text-slate-500 font-bold hover:text-slate-800 underline block w-full transition-colors">กลับไปหน้ากระดานสรุป</button>
                        </div>
                    </div>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App/>);
    </script>
</body>
</html>
